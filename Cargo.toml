[workspace]
members = [".", "client", "nix/tests"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://radicle.defelo.de/nodes/radicle.defelo.de/rad:zKBbWZxz73j7BZMbutM7TMMT4v5K"

[workspace.dependencies]
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false }
uuid = { version = "1.22.0", default-features = false, features = ["v4", "fast-rng", "serde"] }

[package]
name = "sandkasten"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
config = { version = "0.15.19", default-features = false, features = ["toml"] }
key-rwlock = { version = "0.1.2", default-features = false }
poem = { version = "3.1.12", default-features = false, features = ["server", "anyhow"] }
poem-ext = { version = "0.12.1", default-features = false, features = ["shield"] }
poem-openapi = { version = "5.1.16", default-features = false, features = ["swagger-ui", "redoc", "uuid"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
prometheus = { version = "0.14.0", default-features = false }
sandkasten-client = { path = "client", default-features = false, features = ["poem-openapi"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", default-features = false }
thiserror.workspace = true
tokio = { version = "1.50.0", default-features = false, features = ["rt-multi-thread", "macros", "process", "time"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "ansi"] }
url = { version = "2.5.8", default-features = false, features = ["serde"] }
uuid.workspace = true
