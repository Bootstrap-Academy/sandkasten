[workspace]
members = [".", "client", "nix/tests"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://git.defelo.de/Defelo/sandkasten"

[workspace.dependencies]
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
thiserror = { version = "2.0.12", default-features = false }
uuid = { version = "1.17.0", default-features = false, features = ["v4", "fast-rng", "serde"] }

[package]
name = "sandkasten"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { version = "1.0.98", default-features = false, features = ["std"] }
config = { version = "0.15.11", default-features = false, features = ["toml", "json"] }
key-rwlock = { version = "0.1.2", default-features = false }
poem = { version = "3.1.11", default-features = false, features = ["server", "anyhow"] }
poem-ext = { version = "0.12.1", default-features = false, features = ["shield"] }
poem-openapi = { version = "5.1.15", default-features = false, features = ["swagger-ui", "redoc", "uuid"] }
postcard = { version = "1.1.1", default-features = false, features = ["use-std"] }
prometheus = { version = "0.14.0", default-features = false }
sandkasten-client = { path = "client", default-features = false, features = ["poem-openapi"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", default-features = false }
thiserror.workspace = true
tokio = { version = "1.45.1", default-features = false, features = ["rt-multi-thread", "macros", "process", "time"] }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "ansi"] }
url = { version = "2.5.4", default-features = false, features = ["serde"] }
uuid.workspace = true
