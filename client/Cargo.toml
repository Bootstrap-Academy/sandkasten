[package]
name = "sandkasten-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sandkasten client library for running untrusted code"
documentation = "https://docs.rs/sandkasten-client/"
publish = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest", "dep:url"]
blocking = ["reqwest", "reqwest/blocking"]
poem-openapi = ["dep:poem-openapi"]

[dependencies]
poem-openapi = { version = "5.1.16", default-features = false, optional = true, features = ["uuid"] }
reqwest = { version = "0.13.4", default-features = false, optional = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = { version = "2.5.8", default-features = false, optional = true }
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
